{% extends 'base_public.html' %}
{% block content %}
<section class="container not-found-page">
  <span class="eyebrow">404 / USAparts.top</span>
  <h1>Цю сторінку не знайдено</h1>
  <p>Товар міг бути видалений або адреса змінилася. Знайдіть потрібну деталь за OEM номером.</p>
  <form class="store-header-search" action="{{ url_for('catalog') }}" method="get" role="search">
    <input name="q" aria-label="OEM номер або назва деталі" placeholder="Введіть OEM номер або назву">
    <button class="btn primary">Знайти</button>
  </form>
  <a class="text-link" href="{{ url_for('catalog') }}">Перейти до каталогу</a>
</section>
{% endblock %}
