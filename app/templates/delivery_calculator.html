{% extends 'base_public.html' %}

{% block content %}
<section class="delivery-calculator-page">
  <div class="container">
    <div class="delivery-calculator-hero">
      <div>
        <span class="eyebrow">USAparts.top</span>
        <h1>Калькулятор доставки</h1>
        <p class="hero-text">
          Розрахунок маршруту доставки авто зі США: суходіл до порту, морський фрахт,
          маржа за кодом клієнта та історія розрахунків.
        </p>
      </div>
      <a class="btn ghost" href="{{ url_for('home') }}">На головну</a>
    </div>

    <div class="delivery-calculator-shell">
      <iframe
        class="delivery-calculator-frame"
        src="{{ url_for('delivery_calculator_app') }}"
        title="Калькулятор доставки авто зі США"
        loading="eager"></iframe>
    </div>
  </div>
</section>
{% endblock %}
